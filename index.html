<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horloge flip</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>
:root{--card:#2b2b2b;--card2:#262626;--line:#0f0f0f;--num:#f4f4f4;--small:#ffffff;color-scheme:dark}
html,body{height:100%;margin:0;background:transparent}
body{overflow:hidden}
.stage{width:100vw;height:100vh;container-type:size;display:flex;gap:1.6cqw}
.panel{position:relative;flex:1;perspective:140cqw;font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-weight:600}
.half{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--card);backface-visibility:hidden}
.top{top:0;border-radius:2.2cqw 2.2cqw 0 0;transform-origin:bottom}
.bot{top:50%;border-radius:0 0 2.2cqw 2.2cqw;background:var(--card2);transform-origin:top}
.num{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;font-size:min(40cqw,54cqh);line-height:1;color:var(--num)}
.top .num{top:0}.bot .num{top:-100%}
.flap{display:none;z-index:2}
.panel::after{content:"";position:absolute;left:0;right:0;top:calc(50% - .25cqw);height:.5cqw;background:var(--line);z-index:5}
.small{position:absolute;bottom:min(3cqw,4cqh);font-size:min(4.6cqw,6.4cqh);letter-spacing:.08em;color:var(--small);z-index:6;font-family:Arial,Helvetica,sans-serif;font-weight:900}
.l{left:3.4cqw}.r{right:3.4cqw}
</style></head><body>
<div class="stage">
  <div class="panel" id="ph"><div class="half top t"><div class="num">00</div></div><div class="half bot b"><div class="num">00</div></div><div class="half top flap ft"><div class="num">00</div></div><div class="half bot flap fb"><div class="num">00</div></div></div>
  <div class="panel" id="pm"><div class="half top t"><div class="num">00</div></div><div class="half bot b"><div class="num">00</div></div><div class="half top flap ft"><div class="num">00</div></div><div class="half bot flap fb"><div class="num">00</div></div><div class="small r" id="day"></div></div>
</div>
<script>
(function(){
  var pad=function(n){return String(n).padStart(2,"0")};
  function q(p,c){return p.querySelector(c+" .num")}
  function Panel(id){this.p=document.getElementById(id);this.v=null;}
  Panel.prototype.set=function(v){
    var p=this.p,old=this.v;
    if(old===null){["t","b","ft","fb"].forEach(function(c){q(p,"."+c).textContent=v});this.v=v;return;}
    if(old===v)return;
    this.v=v;
    var ft=p.querySelector(".ft"),fb=p.querySelector(".fb");
    q(p,".t").textContent=v;q(p,".ft").textContent=old;q(p,".fb").textContent=v;
    ft.style.display=fb.style.display="block";
    ft.animate([{transform:"rotateX(0)"},{transform:"rotateX(-90deg)"}],{duration:300,easing:"ease-in",fill:"forwards"});
    fb.animate([{transform:"rotateX(90deg)"},{transform:"rotateX(0)"}],{duration:300,delay:300,easing:"ease-out",fill:"both"});
    setTimeout(function(){q(p,".b").textContent=v;ft.style.display=fb.style.display="none";},620);
  };
  var H=new Panel("ph"),M=new Panel("pm");
  function tick(){
    var d=new Date(),h=d.getHours();
    H.set(pad(h));M.set(pad(d.getMinutes()));
    document.getElementById("day").textContent=d.toLocaleDateString("fr-FR",{weekday:"long"}).toUpperCase();
  }
  tick();setInterval(tick,1000);
})();
</script></body></html>
